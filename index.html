<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>作品集</title>
<style>
:root{--paper:#F0F1EE;--ink:#15161B;--ink-2:#4A4E57;--ink-3:#7A7F87;--line:#B8BCB6;--signal:#FFC933;--on-signal:#17150B;--err:#B42318;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--paper:#121216;--ink:#ECECEF;--ink-2:#A6A7AF;--ink-3:#74757E;--line:#3C3C44;--err:#FF8A7A;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;align-items:center;padding:24px max(16px,6vw);background:var(--paper);color:var(--ink);font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif}
main{width:100%;max-width:420px}
.mark{display:inline-block;padding:4px 8px 3px;background:var(--signal);color:var(--on-signal);font-size:13px;font-weight:600;letter-spacing:.08em}
h1{margin:20px 0 8px;font-size:30px;font-weight:800}
p{margin:0;font-size:15px;line-height:1.8;color:var(--ink-2)}
form{display:grid;gap:10px;margin-top:28px}
label{font-size:13px;letter-spacing:.06em;color:var(--ink-3)}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;padding:12px 14px;font:inherit;font-size:16px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:0}
input:focus{outline:2px solid var(--signal);outline-offset:0;border-color:var(--signal)}
button{padding:0 22px;font:inherit;font-size:15px;color:var(--paper);background:var(--ink);border:1px solid var(--ink);border-radius:0;cursor:pointer}
button:disabled{opacity:.6;cursor:progress}
button:focus-visible{outline:2px solid var(--signal);outline-offset:3px}
.msg{min-height:1.8em;font-size:14px;color:var(--ink-3)}
.msg.err{color:var(--err)}
</style>
</head>
<body>
<main>
  <span class="mark">仅限受邀访问</span>
  <h1>作品集</h1>
  <p>页面内容已加密，请输入分享给你的访问密码。</p>
  <form id="f" autocomplete="off">
    <label for="pw">访问密码</label>
    <div class="row"><input id="pw" type="password" required autofocus><button id="go" type="submit">进入</button></div>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </form>
  <noscript><p>请开启浏览器的 JavaScript 后访问。</p></noscript>
</main>
<script>
(function(){
  var ITER=600000;
  var f=document.getElementById('f'),pw=document.getElementById('pw'),go=document.getElementById('go'),msg=document.getElementById('msg');
  var buf=null;
  function load(){return buf||(buf=fetch('payload.bin',{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error('load');return r.arrayBuffer()}))}
  load().catch(function(){buf=null});
  async function unlock(p){
    var data=new Uint8Array(await load());
    var salt=data.slice(4,20),iv=data.slice(20,32),ct=data.slice(32);
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    var gz;
    try{gz=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct)}catch(e){throw new Error('pw')}
    return await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  }
  function fail(t){go.disabled=false;msg.className='msg err';msg.textContent=t;pw.select()}
  f.addEventListener('submit',async function(e){
    e.preventDefault();
    if(!window.crypto||!crypto.subtle||typeof DecompressionStream==='undefined'){fail('当前浏览器版本过旧，请换用新版 Chrome、Safari 或 Edge。');return}
    go.disabled=true;msg.className='msg';msg.textContent='正在解密…';
    try{
      var html=await unlock(pw.value);
      try{sessionStorage.setItem('qs-pw',pw.value)}catch(_){}
      document.open();document.write(html);document.close();
    }catch(err){
      try{sessionStorage.removeItem('qs-pw')}catch(_){}
      fail(err&&err.message==='pw'?'密码不正确，请重新输入。':'内容加载失败，请检查网络后重试。');
    }
  });
  try{var saved=sessionStorage.getItem('qs-pw');if(saved){pw.value=saved;f.requestSubmit?f.requestSubmit():go.click()}}catch(_){}
})();
</script>
</body>
</html>
